[build-system]
requires = ["setuptools>61", "weel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable Maze Generator Module"
requires-python = ">3.10"
authors = [{ name = "lelourens" }, { name = "odschreu" }]
dependencies = [""]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen"]
